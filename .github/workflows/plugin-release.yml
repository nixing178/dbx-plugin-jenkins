name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.9
    with:
      release-tag: ${{ github.event.release.tag_name }}
      # ui/ 与 dist/ 不进 Git，CI 必须从源码构建 UI 再打包
      package-command: npm install -g pnpm@10.11.0 && pnpm install --frozen-lockfile && pnpm build && dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.9
      # Go Sidecar 必须在对应 OS/架构的 runner 上原生打包。
      # 与固定版本 reusable workflow 的默认平台集合保持一致。
      build-matrix: >-
        {"include":[
          {"runner":"windows-2022","target":"windows-x64"},
          {"runner":"macos-15-intel","target":"darwin-x64"},
          {"runner":"macos-15","target":"darwin-arm64"},
          {"runner":"ubuntu-24.04","target":"linux-x64"},
          {"runner":"ubuntu-24.04-arm","target":"linux-arm64"}
        ]}
